# Rendered by deploy/install-systemd-user (skip with --no-heyma-tray).
# The HeyMa tray (heyma-tray.service) owns the one desktop icon on this host, so
# waxd must not spawn its own tray child. Without this file waxd keeps its tray,
# which is the right default for a host that runs no HeyMa shell.
[Service]
Environment=WAX_TRAY=off
