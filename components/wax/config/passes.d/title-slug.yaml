slug: title-slug
version: 3
description: Grounded title and summary, with a date-prefixed transcript filename.
capabilities: [audio, document]  # rename is audio identity; title/summary proposals enrich documents too
enabled: true
auto: true
requires: []
# 6 chain members x 60s request timeout = 360s, plus the 10s catalog lookup and
# the 5s op read, inside 390s less the 10s reserve. The pass also runs the chain
# against a deadline taken from this value (WAX_PASS_TIMEOUT_S), so the runner
# never kills it before it reports every member.
timeout_s: 390
frontmatter_schema: "{home}/d/_vault/Settings/frontmatter-category-map.json"
env:
  WAX_TITLE_API_BASE: https://api.automaticai.io/v1
  WAX_TITLE_MODEL: automaticai/auto/fast
  # Ordered fallbacks: explicit subscription GLM, then metered Hyper, then the
  # free family. Never Anthropic.
  WAX_TITLE_MODEL_FALLBACKS: automaticai/personal/glm-5.3-flash,automaticai/personal/glm-5.3,automaticai/hypercharm/glm-5.3,automaticai/hypercharm/minimax-m3,automaticai/free
  WAX_TITLE_API_KEY_OP: op://DeLoSecrets/yeurk5dpqkaarspvsn3cjtmkki/heyma-wax-inference
  WAX_TITLE_REQUEST_TIMEOUT_S: "60"
command: ["{component_root}/config/passes.d/bin/title-slug", "{md_path}", "{item_id}"]
