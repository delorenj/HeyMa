slug: diarization
version: 1
description: CUDA Sortformer speaker turns using durable timed ASR without repeating Whisper.
capabilities: [audio]      # needs the recording and its ledger rows
enabled: true
auto: true
kind: diarization
# Skip a transcript that classification calls a monolog (operator order,
# 2026-10-27: a monolog must not be diarized). This reverses the 2026-10-12
# review's "diarize unconditionally" (V2) only for that positive verdict: a
# meeting, other, or a missing classification (failed, skipped, still unknown)
# still diarizes, so a classifier outage never costs speaker attribution.
# `after` (ordering only, never gating) makes the verdict visible before this
# runs; a failed classification leaves the field absent and diarization runs.
# The WAX_DIARIZATION env kill-switch (explicitly_disabled) still applies.
requires: []
after: [classification]
when:
  - {field: classification, not_equals: monolog}
body_mutation: compare-and-replace
clobber: [diarized, diarization-requested, diarization-device-requested, diarization-device]
timeout_s: 86400
command: ["{component_root}/config/passes.d/bin/diarization", "{md_path}", "{item_id}"]
