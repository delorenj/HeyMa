slug: diarization
version: 1
description: CUDA Sortformer speaker turns using durable timed ASR without repeating Whisper.
capabilities: [audio]      # needs the recording and its ledger rows
enabled: true
auto: true
kind: diarization
# No skip_when: the 2026-10-12 review found the classification gate pointed the
# wrong way — diarization is the stage that answers speaker-count definitively,
# and a misclassified meeting cost a permanently unattributed transcript while
# a diarized monolog costs only GPU minutes. Diarize unconditionally; the
# WAX_DIARIZATION env kill-switch (explicitly_disabled) is the only skip left.
requires: []
body_mutation: compare-and-replace
clobber: [diarized, diarization-requested, diarization-device-requested, diarization-device]
timeout_s: 86400
command: ["{component_root}/config/passes.d/bin/diarization", "{md_path}", "{item_id}"]
