slug: classification
version: 1
description: Grounded document classification as monolog, meeting or other.
capabilities: [document]   # grounded text classification; no audio needed
enabled: true
auto: true
requires: []
# 6 chain members x 60s request timeout = 360s, plus the 10s catalog lookup and
# the 5s op read, inside 390s less the 10s reserve. The pass also runs the chain
# against a deadline taken from this value (WAX_PASS_TIMEOUT_S), so the runner
# never kills it before it reports every member.
timeout_s: 390
env:
  WAX_TITLE_API_BASE: https://api.automaticai.io/v1
  WAX_TITLE_MODEL: automaticai/auto/fast
  # Ordered fallbacks: explicit subscription GLM, then metered DeepSeek, then the
  # free family. Never Anthropic.
  WAX_TITLE_MODEL_FALLBACKS: automaticai/personal/glm-5.3-flash,automaticai/personal/glm-5.3,automaticai/deepseek/deepseek-flash,automaticai/deepseek/deepseek-v4-pro,automaticai/free
  WAX_TITLE_API_KEY_OP: op://DeLoSecrets/yeurk5dpqkaarspvsn3cjtmkki/heyma-wax-inference
  WAX_TITLE_REQUEST_TIMEOUT_S: "60"
command: ["{component_root}/config/passes.d/bin/classification", "{md_path}", "{item_id}"]
