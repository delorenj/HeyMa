slug: classification
version: 2
description: Jev classification of a recording as monolog, meeting, phone_call or other (telnyx and floor rules first).
capabilities: [document]   # grounded text classification; no audio needed
enabled: true
auto: true
requires: []
# Re-runs (wax ep run ... with WAX_CLASSIFICATION_RECLASSIFY=1) refresh the whole verdict,
# so every key this pass writes may replace an earlier pass's value. A value whose
# `classification-source` is not one of this pass's own is a human's and is kept by the
# script itself (docs/HOLOCENE-TRANSCRIPTS-TAB.md A.6, F.5).
clobber: [classification, classification-detail, classification-confidence, classification-source]
# One ~0.5s Jev call with a 20s timeout and one retry (~41s worst case) plus the 5s
# op read, inside 60s. No model chain: Jev goes through the fleet's Jev ingress
# (jev-litellm), not the AutomaticAI gateway.
timeout_s: 60
env:
  # HeyMa's own virtual key (alias heyma-wax-classification): $0.50/day budget,
  # 120 rpm, per-request spend in the ingress's spend log. jev-1.13.0 is pinned
  # because the thresholds below were measured on it.
  WAX_JEV_URL: https://jev.delo.sh/typesafe/v1/systemone
  WAX_JEV_MODEL: jev-1.13.0
  WAX_JEV_API_KEY_OP: op://DeLoSecrets/lmtarsmlr35gqyydjsw245mvra/credential
  WAX_CLASSIFICATION_MIN_P: "0.6"
command: ["{component_root}/config/passes.d/bin/classification", "{md_path}", "{item_id}"]
