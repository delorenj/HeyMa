slug: ticketable
version: 1
description: Ticketable work from the transcript, one ticket per deliverable, filed under the note's project-ids.
capabilities: [document]   # reads note text + project-ids
enabled: false
auto: false
# title-slug: tickets record the FINAL transcript filename.
# project-extraction: tickets may only name the note's project-ids.
requires: [title-slug, project-extraction]
clobber: []
emits: [intake.detected]
# 3 windows share one deadline (timeout_s less a 10s reserve, WAX_PASS_TIMEOUT_S):
# each window gets an equal part of what is left, ~596s, room for the primary and
# both GLM routes at the full 120s with the rest of the chain behind them.
timeout_s: 1800
env:
  WAX_TICKETS_API_BASE: https://api.automaticai.io/v1
  WAX_TICKETS_MODEL: automaticai/auto/fast
  # Ordered fallbacks: explicit subscription GLM, then metered DeepSeek, then the
  # free family. Never Anthropic.
  WAX_TICKETS_MODEL_FALLBACKS: automaticai/personal/glm-5.3-flash,automaticai/personal/glm-5.3,automaticai/deepseek/deepseek-flash,automaticai/deepseek/deepseek-v4-pro,automaticai/free
  WAX_TICKETS_API_KEY_OP: op://DeLoSecrets/yeurk5dpqkaarspvsn3cjtmkki/heyma-wax-inference
  # Up to three 240K-char windows per transcript, each down a 6-member chain.
  WAX_TICKETS_REQUEST_TIMEOUT_S: "120"
command: ["{component_root}/config/passes.d/bin/ticketable", "{md_path}", "{item_id}"]
