name: transcript-standard
version: 1
description: >
  Post-transcription enrichment for every recording, as a compiled graph.
  With exactly one compiled AND enabled transcription pipeline — this one —
  NEW audio plans are minted from its frozen definition (the worker's
  ensure_plan() adopts it as the plan authority); with none compiled, the
  live registry plan stands. Recompiling is explicit, so a registry edit
  changes nothing until this file is compiled again; compile a second enabled
  transcription pipeline and the authority is refused as ambiguous, falling
  back to the registry plan.
trigger: transcription
enabled: true
failure_policy: independent
# dictionary-correction respells the speaker's own words after diarization
# (which re-renders the body); title, clipboard and projects are ordered after
# it (ordering only, never a gate) so they read the corrected text, and so is
# voice-id (two body replacements never race; its model load never delays the
# clipboard). The edges
# live here, not in those passes' registry `after:`, so switching the
# dictionary pass off never quarantines them.
passes:
  - frontmatter-stamp
  - {slug: clipboard-copy, after: [dictionary-correction]}
  - classification
  - {slug: title-slug, after: [dictionary-correction]}
  - diarization
  - {slug: project-extraction, after: [dictionary-correction]}
  - call-metadata
  - dictionary-correction
  - {slug: voice-id, after: [dictionary-correction]}
