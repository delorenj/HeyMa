name: doc-standard
version: 2
description: >
  Ordinary Markdown document enrichment over the dedicated inbox folder
  ~/d/Inbox/Wax (created empty; a binding never processes history). Enabled
  passes with the document capability only: classification, title-slug and
  project-extraction (frontmatter proposals; the audio rename contract does
  not apply to documents). Compiled+enabled, the worker scans the binding on its own
  cadence; the first scan of an existing folder seeds files without
  processing them.
trigger: documents
enabled: true
failure_policy: independent
folders:
  - /home/delorenj/d/Inbox/Wax
passes:
  - classification
  - title-slug
  - project-extraction
