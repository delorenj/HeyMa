# PRIVATE pipewire for HEYMA-19 validation. No ALSA/udev enumeration, no devices: only a null sink.
context.properties = {
    core.daemon = true
    core.name   = pipewire-0
    link.max-buffers = 16
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    audio.adapt     = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-access args = { } }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-session-manager }
    { name = libpipewire-module-protocol-pulse
      args = { server.address = [ "unix:native" ] } }
]
context.objects = [
    { factory = metadata args = { metadata.name = default } }
    { factory = spa-node-factory
      args = { factory.name = support.node.driver node.name = Dummy-Driver node.group = pipewire.dummy priority.driver = 20000 } }
    { factory = adapter
      args = {
        factory.name = support.null-audio-sink
        node.name = heyma19-silent-sink
        node.description = "heyma19 private null sink"
        media.class = Audio/Sink
        audio.position = [ FL FR ]
        monitor.channel-volumes = true
        object.linger = true
        adapter.auto-port-config = { mode = dsp monitor = true control = false position = preserve }
      } }
]
