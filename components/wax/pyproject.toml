[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heyma-wax"
version = "0.1.0"
description = "HeyMa recording and transcription pipeline component"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Without this every invocation needed PYTHONPATH=src prefixed by hand, so the
# 43-test suite was in practice never run — which is how a deleted Ollama model
# and a deleted whisperlivekit tree both shipped green for a week.
pythonpath = ["src"]
testpaths = ["tests"]
