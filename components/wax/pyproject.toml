[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heyma-wax"
version = "0.1.0"
description = "HeyMa recording and transcription pipeline component"
requires-python = ">=3.11"
# Documentation of what the code imports. The runtime is /usr/bin/python3 with apt packages
# (python3-psycopg 3.2.6 for the transcriptions store); nothing installs from this list.
dependencies = ["PyYAML>=6", "jsonschema>=4.19", "psycopg[binary]>=3.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Without this every invocation needed PYTHONPATH=src prefixed by hand, so the
# 43-test suite was in practice never run — which is how a deleted Ollama model
# and a deleted whisperlivekit tree both shipped green for a week.
pythonpath = ["src"]
testpaths = ["tests"]
