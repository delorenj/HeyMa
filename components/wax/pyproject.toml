[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heyma-wax"
version = "0.1.0"
description = "HeyMa recording and transcription pipeline component"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
