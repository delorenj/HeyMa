# HeyMa custom dictionary
#
# The words speech recognition always gets wrong: project, tool, host, domain,
# company and people names, spelled the way they should be written. The Wax
# `dictionary-correction` pass reads this file on every transcript and fixes
# anything that sounds like a term here but is not spelled like it, after asking
# Jev whether that reading fits the context ("skill set" in a job interview is
# not Skillex). Edits take effect on the next transcript; nothing to compile or
# restart.
#
# One term per key, written exactly as it should appear (case matters):
#
#   Skillex:                                  # just the word
#   Skillex: my skill registry                # the word and what it is
#   Skillex: [skillix, skill x]               # the word and how it gets misheard
#   Skillex: {heard: [skillix, skill x], about: "my skill registry"}
#
# Quote an `about` that contains a comma or a colon, as below.
#
# `heard` lists mis-hearings you have actually seen. They are accepted more
# readily than a sound-alike the pass finds on its own, but Jev still checks
# each one in context. Leave ordinary English words out of `heard` (they are
# right most of the time); the pass still finds them by sound, at the normal bar.
# `about` is one short line Jev is shown, so it can tell your Skillex from a
# skill set. A spoken "dot" in a domain or file name ("delo dot sh",
# "settings dot json") is fixed without being listed.
#
# Seeded 2026-11-04 by mining the 944 transcripts in ~/d/Transcripts.

